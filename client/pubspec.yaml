name: karunstream
description: "KarunStream: LAN Chat & High-Speed File Sharing"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cached_network_image: ^3.4.1
  collection: ^1.19.0
  crypto: ^3.0.6
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.6
  dio: ^5.9.0
  easy_localization: ^3.0.7
  envied: ^1.1.1
  equatable: ^2.0.5
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  flutter_svg: ^2.2.1
  freezed_annotation: ^3.0.0
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  google_sign_in: ^7.2.0
  hugeicons: ^1.1.7
  image_picker: ^1.2.0
  json_annotation: ^4.9.0
  lottie: ^3.3.2
  ming_cute_icons: ^0.0.7
  package_info_plus: 8.1.0
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pinput: ^6.0.2
  riverpod_annotation: ^4.0.0
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  sqflite: ^2.4.2
  supabase_flutter: ^2.10.3
  url_launcher: ^6.3.2
  uuid: ^4.4.0
  web_socket_channel: ^3.0.1
  curved_navigation_bar: ^1.0.6
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.1.0
  flutter_dotenv: ^6.0.1
  intl: ^0.20.2
  logger: ^2.7.0
  device_info_plus: 12.0.0
  timezone: ^0.11.0
  flutter_local_notifications: ^21.0.0
  fluttertoast: ^9.1.0
  multicast_dns: ^0.3.3

dev_dependencies:
  build_runner: ^2.4.13
  change_app_package_name: ^1.5.0
  custom_lint: ^0.8.1
  envied_generator: ^1.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  json_serializable: ^6.9.5
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
  test: ^1.25.8

flutter_launcher_icons:
  image_path: assets/images/logo.png
  android: "launcher_icon"
  ios: "launcher_icon"
  web:
   generate: true
  windows:
    generate: true
    icon_size: 48
  macos:
    generate: true

  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/google_fonts/
    - assets/images/
    - assets/translations/
    - .env

  fonts:
    - family: Kanit
      fonts:
        - asset: assets/fonts/Kanit-Regular.ttf
        - asset: assets/fonts/Kanit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Kanit-Bold.ttf
          weight: 700
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Variable.ttf
